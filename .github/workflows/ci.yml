# CI configuration — PRED Agent
# Grounded in kit/09_CONFIG_SECURITY_DEPLOY.md (Dependency pinning, pip-audit)

name: pred-agent-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: predagent
          POSTGRES_USER: predagent
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run ruff
        run: cd backend && ruff check src/ scripts/ tests/

      - name: Run mypy
        run: cd backend && mypy src/

      - name: Run pytest
        run: cd backend && pytest tests/

      - name: Run pip-audit
        run: cd backend && pip-audit
