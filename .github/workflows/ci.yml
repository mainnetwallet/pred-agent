# CI configuration — PRED Agent
# Grounded in kit/09_CONFIG_SECURITY_DEPLOY.md (Dependency pinning, pip-audit)

name: pred-agent-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-audit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: predagent
          POSTGRES_USER: predagent
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd backend
          pip install -e ".[dev]"

      - name: Run ruff
        run: cd backend && ruff check src/ scripts/ tests/

      - name: Run mypy
        run: cd backend && mypy src/

      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://predagent:postgres@localhost:5432/predagent

      - name: Run pip-audit
        run: cd backend && pip-audit

      - name: Update OpenAPI snapshot
        run: |
          cd backend
          python -c "
          import json, sys
          sys.path.insert(0, 'src')
          from pred_agent.control_api.app import create_app
          app = create_app()
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          print('OpenAPI snapshot written to backend/openapi.json')
          print(f'Paths: {list(schema.get(\"paths\", {}).keys())}')
          "

      - name: Check OpenAPI snapshot committed
        run: |
          cd backend
          if [ -f openapi.json ]; then
            echo "OpenAPI snapshot exists ($(wc -c < openapi.json) bytes)"
          else
            echo "ERROR: openapi.json not generated"
            exit 1
          fi

  mobile-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Run mobile Jest tests
        run: npx jest --no-coverage
        working-directory: mobile
