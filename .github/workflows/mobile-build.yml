# Mobile app build — PRED Agent (Expo / React Native)
# Android APK build kore artifact hishebe upload kore.
# Manual run: Actions -> mobile-build -> Run workflow.

name: mobile-build

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile/**"
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # expo-router er peer dep (react-navigation v7) vs app er v6 conflict kore,
      # tai --legacy-peer-deps lagbe.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Jest
        run: npx jest

      - name: Typecheck
        run: npx tsc --noEmit

      # Metro bundle check: missing module hole ekhanei fail kore, Gradle er age.
      - name: JS bundle check
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Expo template er Gradle (8.10.2) out-of-date; 8.x er latest e uthano hocche.
      # (Gradle 9 na: AGP 8.x / RN 0.76 er sathe compatible na.)
      - name: Update Gradle wrapper
        run: |
          sed -i -E 's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.14.3-bin.zip#' mobile/android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl mobile/android/gradle/wrapper/gradle-wrapper.properties

      # JS-only change hole native compile skip hoy (Gradle up-to-date), build ~1-2 min.
      # Key: lockfile + app.json + native config; ei file gulo bodlale full native rebuild hobe.
      - name: Cache Android native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile/android/.gradle
            mobile/android/build
            mobile/android/app/build
            mobile/android/app/.cxx
            mobile/node_modules/*/android/build
            mobile/node_modules/*/android/.cxx
            mobile/node_modules/@*/*/android/build
            mobile/node_modules/@*/*/android/.cxx
          key: android-native-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', '.github/workflows/mobile-build.yml') }}

      # Release APK te lint-vital cholte dorkar nai (CI te ci.yml/jest/tsc ache) — ~20-40s save.
      - name: Gradle init script (skip lint-vital)
        run: |
          cat > "$RUNNER_TEMP/skip-lint.init.gradle" <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lintVital") || t.name == "lintAnalyzeRelease") { t.enabled = false }
            }
          }
          EOF

      - name: Build release APK
        working-directory: mobile/android
        run: |
          set +e
          # Live output dekhar jonno tee; ekta ABI (arm64-v8a) e build kora hocche, native compile druto hoy.
          # 32-bit/emulator er jonno: -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          ./gradlew assembleRelease --no-daemon --stacktrace \
            --parallel --build-cache -I "$RUNNER_TEMP/skip-lint.init.gradle" \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs=-Xmx4g 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Error ta annotation hishebe dekhano hocche (log na khuleo dekha jay)
            msg=$(grep -B2 -A30 -m1 -E "What went wrong|error:|FAILURE" "$RUNNER_TEMP/gradle.log" | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            # Kotlin/Java compile error line gulo (e: ... ba error: ...)
            kt=$(grep -E "^e: |error: " "$RUNNER_TEMP/gradle.log" | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ -n "$kt" ]; then echo "::error title=Compiler errors::${kt}"; fi
          fi
          exit $code
        env:
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables).
          # Set na thakle app er default (http://127.0.0.1:8000) use hobe.
          EXPO_PUBLIC_API_BASE: ${{ vars.EXPO_PUBLIC_API_BASE }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: pred-agent-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
