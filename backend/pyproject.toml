[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pred-agent"
version = "0.1.0"
description = "Human-in-the-loop trading agent for PRED (Base chain) - Phase 1 foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "httpx==0.27.2",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.13.1",
    "eth-account==0.13.2",
    "web3==7.10.0",
    "ably==3.1.4",
    "python-telegram-bot==21.4",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.26.0",
    "ruff==0.9.6",
    "mypy==1.13.0",
    "pip-audit==2.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pred_agent*"]

[tool.setuptools.package-data]
pred_agent = ["control_api/web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "PL", "S"]
ignore = [
  "S101",     # assert allowed in tests; avoid bare except elsewhere
  "PLR2004",  # magic values (HTTP status codes, EIP-712 sizes) are clearer inline
  "PLR0913",  # signing/order functions legitimately take many arguments
  "PLR0912",  # branch/statement count limits are too noisy for protocol code
  "PLR0915",
  "E501",     # line length is handled by `ruff format`; long strings/hex/comments are fine
]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
