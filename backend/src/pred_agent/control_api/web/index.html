<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRED Agent</title>
<meta name="description" content="PRED Agent — human-in-the-loop sports trading assistant">
<meta name="theme-color" content="#0B0F14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRED Agent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark light;
  --bg:#0B0F14;--surface:#141B23;--alt:#1C2530;--text:#E8ECF1;--text2:#8FA3B8;--muted:#6B7C8F;--line:#2A3644;
  --primary:#60A5FA;--input:#10161D;--long:#22C55E;--short:#EF4444;--alert:#F59E0B;--track:#2A3644;
  --paper-bg:#10243A;--paper:#60A5FA;--live-bg:#3A1316;--live:#EF4444;--paused-bg:#3A2A10;--paused:#F59E0B;
  --primary-soft:#13294A;--long-soft:#0F2A1B;--short-soft:#331517;--alert-soft:#3A2A10;--tabbar:#0F151C;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{
  --bg:#E4E8EC;--surface:#F2F4F6;--alt:#DDE2E7;--text:#1A1F26;--text2:#56606B;--muted:#7A8590;--line:#C5CCD4;
  --primary:#0A6BE0;--input:#F2F4F6;--long:#16A34A;--short:#DC2626;--alert:#C2410C;--track:#CBD2D9;
  --paper-bg:#D3E3F3;--paper:#1565C0;--live-bg:#F1D6D9;--live:#C62828;--paused-bg:#F1E0C8;--paused:#C2410C;
  --primary-soft:#D5E4F8;--long-soft:#D4EBDD;--short-soft:#F3D9D9;--alert-soft:#F1E0C8;--tabbar:#F7F8FA}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.long{color:var(--long)}.short{color:var(--short)}.alert{color:var(--alert)}.muted{color:var(--text2)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
#app{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:660px){#app{border-inline:1px solid var(--line)}}
header.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
header.top .titles{flex:1;min-width:0}
header.top .hdr-logo{flex:none;border-radius:8px}
header.top h1{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{color:var(--text2);font-size:12px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;padding:6px;margin-left:-8px;color:var(--text);display:flex;border-radius:10px}
.pill{border:1px solid;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.paper{background:var(--paper-bg);color:var(--paper)}
.pill.live{background:var(--live-bg);color:var(--live)}
.pill.paused{background:var(--paused-bg);color:var(--paused)}
.panic{display:flex;align-items:center;gap:5px;border:1px solid var(--short);color:var(--short);background:transparent;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px}
.panic:active{background:var(--short-soft)}
.stale{margin:0 16px 10px;padding:9px 12px;border:1px solid var(--paused);background:var(--paused-bg);color:var(--paused);border-radius:12px;font-size:12px;font-weight:700}
main#view{flex:1;overflow-y:auto;padding:0 16px 24px;overscroll-behavior:contain}
main#view.chatmode{display:flex;flex-direction:column;overflow:hidden;padding:0}
nav#tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbar);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
.tab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0}
.tab.active{color:var(--primary)}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--short);color:#fff;font:800 10px/17px var(--sans);font-style:normal;text-align:center;padding:0 4px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;width:100%;text-align:left;display:block}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.sect h2{margin:0;font-size:15px;font-weight:700}
.link{background:none;border:0;color:var(--primary);font-size:13px;font-weight:700;padding:4px 0}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.lbl{color:var(--text2);font-size:12px;font-weight:600;margin-bottom:2px}
.hero-v{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:2px}
.hint{color:var(--alert);font-size:12px;margin-top:6px}
.div{height:1px;background:var(--line);margin:14px 0}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{min-width:90px}.stat span{display:block;color:var(--text2);font-size:12px}.stat b{font-size:17px;font-weight:700}
.chip{display:inline-block;border:1px solid var(--line);background:var(--alt);color:var(--text2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.long{background:var(--long-soft);border-color:var(--long);color:var(--long)}
.chip.short{background:var(--short-soft);border-color:var(--short);color:var(--short)}
.chip.alert{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.chip.neutral{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;text-align:center}
.empty span{color:var(--text2);font-size:13px}
.seg{display:flex;background:var(--alt);border-radius:12px;padding:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--alt);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.long{background:var(--long);border-color:var(--long);color:#fff}
.btn.short{background:var(--short);border-color:var(--short);color:#fff}
.btn.ghost{background:none}
.btn.block{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
input,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text)}
input.mono{font-family:var(--mono)}
select{font:inherit;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);min-height:40px}
.trade{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.trade:first-child{border-top:0;margin-top:0;padding-top:0}
.trade .row{margin-top:8px}.trade input{max-width:110px}
.cmdhint{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.cmdhint button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;font-family:var(--mono)}
.err{color:var(--short);min-height:1.4em;font-size:13px}
.note{font-size:12px;color:var(--text2)}
.list{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--text2)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* fixtures + gauge */
.team{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.score{font-family:var(--mono);font-weight:800;font-size:18px}
.quotes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quote{background:var(--alt);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--text2)}
.quote b{display:block;font-family:var(--mono);color:var(--text);font-size:13px}
.vs{color:var(--muted);font-weight:500}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--track);margin:6px 0 14px;overflow:visible}
.gauge .fill{height:100%;border-radius:5px;background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 55%,transparent) 6px 10px)}
.gauge .fill.long{--c:var(--long)}.gauge .fill.short{--c:var(--short)}.gauge .fill.neutral{--c:var(--primary)}
.gauge .dot{position:absolute;top:-3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--text);border:3px solid var(--bg)}
.bigscore{font-family:var(--mono);font-size:44px;font-weight:800;letter-spacing:-.04em;text-align:center;margin:8px 0}
.bigteams{display:flex;justify-content:space-between;gap:10px;text-align:center}
.bigteams b{flex:1;font-size:16px}

/* chat (ChatGPT-style) */
.chatwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:16px max(16px,calc((100% - 768px)/2)) 12px;overscroll-behavior:contain}
.msg{min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:min(82%,600px);background:var(--alt);border:1px solid var(--line);padding:10px 16px;border-radius:20px;white-space:pre-wrap}
.msg.assistant{align-self:stretch;font-size:15.5px;line-height:1.6}
.msg .body>:first-child{margin-top:0}.msg .body>:last-child{margin-bottom:0}
.msg.assistant .body{white-space:normal}
.body p{margin:0 0 .85em}
.body ul,.body ol{margin:0 0 .85em;padding-left:1.45em}.body li{margin:.25em 0}
.body .mdh{margin:1.1em 0 .4em;font-size:1.06em;font-weight:700}
.body a{color:var(--primary)}
.body strong{font-weight:700}
.body code{font-family:var(--mono);font-size:.88em;background:var(--alt);border-radius:6px;padding:.12em .4em}
.body hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.body .warn{color:var(--alert);font-size:13px}
.codeblock{margin:0 0 .9em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--input)}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;background:var(--alt);font-size:12px;color:var(--text2)}
.codeblock pre{margin:0;padding:12px;overflow-x:auto;font-size:13px;line-height:1.5}
.codeblock pre code{background:none;padding:0;font-size:inherit}
.typing{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:14px;padding:4px 0}
.typing .dot{width:12px;height:12px;border-radius:50%;background:var(--text);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.1);opacity:1}}
.msg-tools{display:flex;gap:2px;margin:6px 0 0 -6px}
.act{background:none;border:0;color:var(--muted);border-radius:8px;padding:6px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.act.sm{padding:3px 8px}
.hero{margin:auto;text-align:center;padding:24px 8px;max-width:520px}
.hero img{border-radius:14px}
.hero h2{margin:14px 0 6px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:0;color:var(--text2);font-size:14px}
.chatwrap:not(.is-empty) .hero,.chatwrap:not(.is-empty) .suggest{display:none}
.composer-zone{flex:none;display:flex;flex-direction:column;padding:6px max(12px,calc((100% - 768px)/2)) 8px}
.suggest{order:-1;display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.suggest button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:border-color .15s}
.composer:focus-within{border-color:var(--text2)}
.composer textarea{flex:1;width:auto;border:0;border-radius:0;background:none;resize:none;min-height:36px;max-height:200px;padding:8px 0;line-height:1.45}
.composer textarea:focus-visible{outline:none}
.sendbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
.sendbtn:disabled{background:var(--alt);color:var(--muted);opacity:1}
.disclaimer{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}
.newchat{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;color:var(--text);white-space:nowrap}
.newchat .nclabel{display:none}
@media(min-width:660px){.newchat .nclabel{display:inline}}
.ccard{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);white-space:normal}
.ccard h4{margin:0 0 6px;font-size:12px;color:var(--text2)}
.ccard .actions{display:flex;gap:6px;margin-top:8px}
.frow{padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}.frow:last-child{border:0}

/* login */
#login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14vh) 20px 20px}
#login .logo{display:block;width:72px;height:72px;margin:0 0 20px;border-radius:18px}
#login h1{font-size:30px;letter-spacing:-.03em;margin:0 0 4px}
#login input{margin-bottom:10px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--short);border-radius:18px 18px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h3{margin:0 0 8px;font-size:20px;color:var(--short)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:var(--alt);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--short);color:var(--short)}

/* layout helpers (all sizes) */
.brand,.side-foot{display:none}
.cols{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.cards>.card{margin-bottom:0}
.cards>.card:has(.empty){grid-column:1/-1}
@media(hover:hover){
  .card.tap:hover{border-color:var(--primary)}
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .tab:hover,.seg button:not(.on):hover{color:var(--text)}
  .panic:hover,.newchat:hover,.suggest button:hover{background:var(--alt)}
  .act:hover{background:var(--alt);color:var(--text)}
  .msg-tools{opacity:0;transition:opacity .15s}
  .msg.assistant:hover .msg-tools,.msg-tools:focus-within{opacity:1}
}

/* desktop: sidebar nav + wide content */
@media(min-width:960px){
  #app{max-width:none;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"side top" "side stale" "side main";border:0}
  header.top{grid-area:top;padding:22px 32px 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  header.top .hdr-logo{display:none}
  header.top h1{font-size:26px}
  .stale{grid-area:stale;margin:0 32px 16px}
  main#view{grid-area:main;padding:0 max(32px,calc((100% - 1180px)/2)) 40px}
  nav#tabbar{grid-area:side;display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:2px 10px 22px}
  .brand img{border-radius:8px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px;border-radius:10px}
  .tab.active{background:var(--primary-soft)}
  .tab .badge{position:static;margin-left:auto}
  .side-foot{display:block;margin-top:auto;padding-top:16px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  main#view[data-view=home]{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-content:start}
  [data-view=home] .span2{grid-column:1/-1}
  .hero-v{font-size:46px}
  .seg{max-width:440px}
  #app.is-chat header.top{border-bottom:0;margin-bottom:0;padding:16px 24px 8px}
  #app.is-chat header.top h1{font-size:18px}
  #app.is-chat header.top .sub{display:none}
  .hero h2{font-size:32px}
  .composer-zone{padding-bottom:18px}
  .suggest{order:0;flex-wrap:wrap;justify-content:center;overflow:visible;padding:16px 0 0}
  .chatwrap.is-empty{justify-content:center}
  .chatwrap.is-empty .msgs{flex:none;overflow:visible;padding-bottom:20px}
  .chatwrap.is-empty .hero{margin:0 auto}
  .scrim{align-items:center}
  .sheet{max-width:460px;border-radius:18px}
  .toast{bottom:28px;left:calc(50% + 124px)}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.typing .dot{animation:none}}
</style>
</head>
<body>
<section id="login" class="hidden">
  <img class="logo" src="/icon.svg" width="72" height="72" alt="PRED Agent logo">
  <h1>PRED Agent</h1>
  <p class="muted">Sign in to control the agent.</p>
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn primary block">Sign in</button>
  <p id="loginErr" class="err"></p>
</section>

<div id="app" class="hidden">
  <header class="top">
    <button id="backBtn" class="iconbtn hidden" aria-label="Back"></button>
    <img id="hdrLogo" class="hdr-logo hidden" src="/icon.svg" width="30" height="30" alt="">
    <div class="titles"><h1 id="title">PRED Agent</h1><div id="sub" class="sub"></div></div>
    <button id="newChat" class="newchat hidden" title="New chat"><span id="newChatIc" style="display:flex"></span><span class="nclabel">New chat</span></button>
    <span id="modePill" class="pill hidden"></span>
    <button id="panicTop" class="panic" aria-label="Panic"><span id="panicIc"></span>Panic</button>
  </header>
  <div id="stale" class="stale hidden"></div>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>

<div id="sheet" class="scrim hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="panicTitle">
    <h3 id="panicTitle">Panic</h3>
    <p>This will immediately <b>pause the agent</b>, <b>reject pending proposals</b> and <b>cancel open orders and exit rules</b>.</p>
    <p class="note" id="panicNote"></p>
    <div class="row" style="margin-top:14px">
      <button id="panicNo" class="btn grow">Cancel</button>
      <button id="panicYes" class="btn short grow">Pause &amp; cancel everything</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const GATE = { "X-Confirm": "web-confirm" };

      if (list && list.tag !== tag) flushL();
      if (!list) list = { tag, start: ol ? parseInt(ol[1], 10) : 1, items: [] };
      list.items.push((ul ? ul[1] : ol[2]).trim());
      continue;
    }
    if (list && /^\s+\S/.test(line)) { list.items[list.items.length - 1] += "\n" + line.trim(); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  root.replaceChildren(...out);
}

// A message: .body (text) + .cardsbox (rule/proposal cards). Assistant text is markdown; user text is plain.
function appendChatMsg(role, text, cards) {
  const body = el("div", { class: "body" }), cardsbox = el("div", { class: "cardsbox" });
  const msg = el("div", { class: "msg " + role }, body, role === "user" ? null : cardsbox);
  if (role === "user") body.textContent = text; else if (text) renderMd(body, text);
  (cards || []).forEach((c) => { const ce = renderCard(c); if (ce) cardsbox.append(ce); });
  if (role === "assistant" && text) addTools(msg, () => text);
  chat.box.append(msg); chat.box.scrollTop = chat.box.scrollHeight; chatUi();
  return msg;
}
function renderCard(card) {
  const wrap = el("div", { class: "ccard" });
  const d = card.data || {};
  const done = (btn, r, okText, failText) => { btn.disabled = true; btn.textContent = r.ok ? okText : failText || "Failed"; };
  if (card.type === "fixture_list") {
    wrap.append(el("h4", { textContent: "Fixtures" }));
    (d.fixtures || []).slice(0, 8).forEach((fx) => wrap.append(el("div", { class: "frow" }, chip((fx.state || "?").toUpperCase(), fx.state === "live" ? "short" : "neutral"), " " + (fx.home_team || "?") + " vs " + (fx.away_team || "?"))));
    return wrap;
  }
  if (card.type === "rule") {
    wrap.append(el("h4", { textContent: "Exit rule" }), el("div", { textContent: d.kind + " — " + d.trigger_type + " @ " + d.trigger_value + " (size: " + d.size + ")" }));
    if (d.status === "PENDING") {
      const ok = el("button", { class: "btn long", textContent: "✓ Confirm rule" }), no = el("button", { class: "btn short", textContent: "✗ Cancel" });
      ok.onclick = async () => { if (!confirm("Confirm this exit rule?")) return; const r = await post("/v1/rules/" + encodeURIComponent(d.id) + "/confirm", {}, true); done(ok, r, "Confirmed ✓"); refreshStatus(); };
      no.onclick = async () => { const r = await post("/v1/rules/" + encodeURIComponent(d.id) + "/cancel"); done(no, r, "Cancelled"); };
      wrap.append(el("div", { class: "actions" }, ok, no));
    }
    return wrap;
  }
  if (card.type === "proposal") {
    wrap.append(el("h4", { textContent: "Trade proposal" }), el("div", { textContent: d.side + " @ " + d.price_cents + "¢ · " + d.amount_usd + " USD · " + d.edge_pp + "pp edge" }));
    if (d.status === "PROPOSED") {
      const ok = el("button", { class: "btn long", textContent: "✓ Approve" }), no = el("button", { class: "btn short", textContent: "✗ Reject" });
      ok.onclick = async () => { if (!confirm("Approve this trade proposal?")) return; const r = await post("/v1/proposals/" + encodeURIComponent(d.id) + "/approve", {}, true); done(ok, r, "Approved ✓"); refreshStatus(); };
      no.onclick = async () => { const r = await post("/v1/proposals/" + encodeURIComponent(d.id) + "/reject"); done(no, r, "Rejected"); refreshStatus(); };
      wrap.append(el("div", { class: "actions" }, ok, no));
    }
    return wrap;
  }
  if (card.type === "trade_result") {
    const good = d.ok === true;
    wrap.append(el("h4", { textContent: ((d.kind || "trade") + "").replace(/_/g, " ").toUpperCase() + " · " + (d.status || "?") }));
    const bits = [];
    if (d.side) bits.push((d.side === "long" ? "YES" : "NO") + " " + (d.order_type || "") + (d.price_cents ? " @ " + d.price_cents + "¢" : ""));
    if (d.filled_shares && d.filled_shares !== "0") bits.push(d.filled_shares + " shares filled");
    if (d.position) bits.push("position " + d.position.shares + " sh @ " + d.position.avg_price_cents + "¢ ($" + d.position.cost_usd + ")");
    if (d.remaining_shares) bits.push(d.remaining_shares + " shares still open");
    if (d.plan) bits.push(d.plan.join("; "));
    if (d.exit_plan && d.exit_plan.plan) bits.push("exit plan: " + d.exit_plan.plan.join("; ") + (d.exit_plan.armed ? " (armed)" : " (arms when filled)"));
    if (d.reason) bits.push("why: " + d.reason);
    if (d.note) bits.push(d.note);
    wrap.append(el("div", { class: good ? "" : "warn", textContent: bits.join(" · ") || (good ? "OK" : "Not completed") }));
    return wrap;
  }
  if (card.type === "action") {
    wrap.append(el("h4", { textContent: "Action required" }), el("div", { textContent: d.label || "Confirm this action?" }));
    const go2 = el("button", { class: "btn short", textContent: "Confirm" });
    go2.onclick = async () => {
      if (!confirm(d.label || "Confirm this action?")) return;
      let r;
      if (d.action === "pause") r = await post("/v1/pause", {}, true);
      else if (d.action === "resume") r = await post("/v1/resume", {}, true);
      else if (d.action === "panic") r = await post("/v1/panic", {}, true);
      else if (d.action === "cancel_order") r = await post("/v1/orders/" + encodeURIComponent(d.order_id) + "/cancel", {}, true);
      else if (d.action === "cancel_rule") r = await post("/v1/rules/" + encodeURIComponent(d.rule_id) + "/cancel", {}, true);
      else if (d.action === "withdraw") r = await post("/v1/withdrawals/" + encodeURIComponent(d.withdraw_id) + "/confirm", {}, true);
      else return;
      done(go2, r, "Done ✓"); refreshStatus();
    };
    wrap.append(el("div", { class: "actions" }, go2));
    return wrap;
  }
  return null;
}
async function sendChatMessage(text) {
  if (!text || !text.trim() || !chat || chat.busy) return;
  text = text.trim();
  appendChatMsg("user", text);
  chat.input.value = ""; autosize();
  const bubble = appendChatMsg("assistant", ""), body = bubble.querySelector(".body"), cardsbox = bubble.querySelector(".cardsbox"), box = chat.box;
  const typing = el("div", { class: "typing" }, el("i", { class: "dot" }), el("span", { textContent: "Thinking…" }));
  bubble.append(typing);
  const ctl = new AbortController();
  chat.busy = true; chat.abort = ctl; chatUi();
  let acc = "", copyable = "", finished = false;
  // keep following the stream only while the reader is near the bottom
  const upd = (fn) => { const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120; fn(); if (near) box.scrollTop = box.scrollHeight; };
  const finish = () => {
    typing.remove(); chat.busy = false; chat.abort = null; chatUi();
    if (copyable) addTools(bubble, () => copyable);
  };
  const fail = (m) => { body.textContent = m; finish(); };
  let resp;
  try {
    const headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = "Bearer " + token;
    resp = await fetch("/v1/chat/stream", { method: "POST", headers, signal: ctl.signal, body: JSON.stringify({ message: text, session_id: chatSessionId }) });
  } catch (e) { return fail(e && e.name === "AbortError" ? "Stopped." : "❌ Cannot reach the server."); }
  if (resp.status === 401 && token) { signOut(); return; }
  if (!resp.ok || !resp.body) {
    let err = {}; try { err = (await resp.json()).error || {}; } catch (_) {}
    if (err.code === "rate_limited") return fail("⚠️ একটু ধীরে — বেশি বার্তা পাঠাচ্ছেন। একটু অপেক্ষা করুন।");
    return fail("❌ " + (err.message || "Error occurred."));
  }
  const handle = (event, d) => {
    if (event === "session") { if (!chatSessionId) chatSessionId = d.session_id; }
    else if (event === "delta") { acc += d.text; typing.remove(); upd(() => renderMd(body, acc)); }
    else if (event === "tool") { typing.lastChild.textContent = "Using tool: " + (d.name || "…"); if (!typing.isConnected) bubble.append(typing); }
    else if (event === "reset") { acc = ""; renderMd(body, ""); }
    else if (event === "cards") upd(() => (d.cards || []).forEach((c) => { const ce = renderCard(c); if (ce) cardsbox.append(ce); }));
    else if (event === "done") {
      finished = true; typing.remove();
      if (d.session_id && !chatSessionId) chatSessionId = d.session_id;
      if (d.error === "llm_not_configured") body.textContent = "⚠️ LLM কনফিগার করা নেই। সার্ভারে LLM_API_KEY এবং LLM_MODEL সেট করুন।";
      else if (d.error) body.textContent = "❌ " + (d.reply || "Error occurred.");
      else { copyable = d.reply || acc; upd(() => renderMd(body, copyable)); }
    }
  };
  try {
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) ev = line.slice(6).trim(); else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        try { handle(ev, JSON.parse(data)); } catch (_) {}
      }
    }
  } catch (e) {
    if (!finished) {
      const stopped = e && e.name === "AbortError";
      if (acc) { copyable = acc; if (!stopped) body.append(el("p", { class: "warn", textContent: "⚠️ Connection lost." })); }
      else body.textContent = stopped ? "Stopped." : "⚠️ Connection lost.";
      finished = true;
    }
  }
  if (!finished && !acc) body.textContent = "⚠️ No reply received.";
  finish();
}

// ── Panic: always one tap away; the sheet is the two-step confirmation ──
$("panicTop").onclick = () => {
  const live = S.status && S.status.mode === "LIVE";
  $("panicNote").textContent = live ? "LIVE mode — real funds. Open orders will be cancelled on PRED." : "PAPER mode — simulated orders only.";
  $("sheet").classList.remove("hidden"); $("panicNo").focus();
};
$("panicNo").onclick = () => $("sheet").classList.add("hidden");
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").classList.add("hidden"); });
$("panicYes").onclick = async () => {
  $("panicYes").disabled = true;
  const r = await post("/v1/panic", {}, true);
  $("panicYes").disabled = false; $("sheet").classList.add("hidden");
  toast(r.ok ? "Panic done — agent paused, orders cancelled" : errOf(r), !r.ok);
  await refreshStatus(); if (S.reload) S.reload();
};
document.addEventListener("keydown", (e) => {
  const sheetOpen = !$("sheet").classList.contains("hidden");
  if (e.key === "Escape") { if (sheetOpen) $("sheet").classList.add("hidden"); else if (S.detail) history.back(); return; }
  // Desktop shortcuts: 1–5 switch tabs (ignored while typing or with modifiers).
  const t = document.activeElement, typing = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if (typing || sheetOpen || e.ctrlKey || e.metaKey || e.altKey || !token) return;
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= TABS.length) go(TABS[i - 1][0]);
});

buildChrome();
if (token) showApp(); else $("login").classList.remove("hidden");
</script>
