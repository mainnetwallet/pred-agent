# Render Blueprint — PRED Agent (web dashboard + app API + Telegram bot in one service)
# Secrets are NOT stored here: every `sync: false` var is entered in the Render dashboard.
#
# E5: Postgres database added. DATABASE_URL is injected by Render automatically.
# LIVE_TRADING stays "false" — you set it manually after completing the live checklist.

databases:
  - name: pred-agent-db
    databaseName: predagent
    user: predagent
    plan: free              # upgrade to starter for backups
    ipAllowList: []         # only accessible from Render private network

services:
  - type: web
    name: pred-agent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter            # always-on; free plan sleeps and would stop the Telegram bot
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pred-agent-db
          property: connectionString
      - key: LIVE_TRADING    # keep false until you finish the live checklist
        value: "false"
      - key: ADMIN_USERNAME
        value: admin         # change if you like
      - key: ADMIN_PASSWORD  # login password for website + app
        sync: false
      - key: SESSION_SECRET  # signs login tokens; keeps sessions valid across redeploys
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: PRED_AUTH_MODE  # clob (default, needed for live orders) or jwt (enablement CLI only)
        value: clob
      - key: PRED_API_KEY    # OPTIONAL, jwt mode only. CLOB (live orders) does not use it.
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL       # e.g. gpt-4o-mini, deepseek-chat, or your provider's model id
        sync: false
      - key: LLM_BASE_URL    # e.g. https://api.openai.com/v1 or https://openrouter.ai/api/v1
        value: https://api.openai.com/v1
      - key: BASE_RPC_URL    # public Base RPC (no key, not a secret): withdrawals + on-chain checks
        value: https://base.drpc.org
